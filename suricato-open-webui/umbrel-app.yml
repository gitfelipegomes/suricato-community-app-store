description: >-
  This edition of Open WebUI does not include or require Ollama. Connect your preferred AI provider to chat with models from local or online services.


  **Getting Started:**


  🔌 Connect a Provider: Open the Connections settings and add a compatible provider using its URL and, when required, an API key.


  🏠 Local Models: To run models on your own hardware, connect Open WebUI to a supported local inference service available on your network.


  ☁️ Online Models: You can also connect to compatible hosted services and start chatting after selecting an available model.


  ⚠️ Warning: Before running a model, make sure your device has enough free RAM to support it. Attempting to run a model that exceeds your available memory could cause your device to crash or become unresponsive. Always check the model requirements before downloading or starting it.
