releaseNotes: >-
  Open WebUI 0.11.4 includes interface, notes, model-management, terminal, and web-search improvements. Back up your Open WebUI data before updating.


  Key highlights in this release:
    - Adds terminal-backed skills, terminal instructions, command tabs, folder uploads, file comparison, and reusable skill creation from chats
    - Adds model background images, localized suggested prompts, interface wording overrides, per-language names/descriptions, admin model-list filters, and settings search by name
    - Improves Notes with a formatting switch, a quick delete shortcut, and fixes for note title/attachment saves when leaving a note
    - Reduces the standard container image size and adds a much smaller slim image upstream
    - Improves web/search tooling with Staan and Exa options, faster media page reads, better SearchApi error handling, and cleaner web-result citations
    - Fixes home-page chat draft persistence, failed settings feedback, stale-tab reloads after updates, admin user/model-default dialogs, knowledge folder deletion, MCP tool pagination, and several sharing/access-control edge cases

  Full release notes are available at https://github.com/open-webui/open-webui/releases/tag/v0.11.4
